<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUE BABY LOTTERY</title><meta name="description" content="选一个池子，让相遇泛起涟漪。双池头像互动原型。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='10' fill='%232c80ff'/%3E%3Ccircle cx='23' cy='16' r='8' fill='%23ff8bb1'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#182d42;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #327eff;outline-offset:4px}button{border:0}header{height:90px;display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:auto;padding:0 30px}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:800}.logo{color:#2584fc;font-size:36px;letter-spacing:-12px;padding-right:12px}.brand small{font-size:11px;letter-spacing:2px;display:block;margin-top:2px;color:#708095}.pill{border:1px solid #e1e8ee;border-radius:30px;padding:8px 14px;background:white;color:#788697;font-size:12px;letter-spacing:1px}main{max-width:1000px;margin:auto;padding:20px 30px 35px}.intro{text-align:center}.eyebrow{font-size:12px;letter-spacing:3px;color:#8191a4}h1{font-size:36px;letter-spacing:1px;margin:14px 0 10px;font-weight:750}.intro p{font-size:14px;color:#8290a2;margin:0}.summary{display:flex;align-items:center;justify-content:center;gap:12px;margin:26px auto 22px;font-size:13px;color:#728397}.summary strong{font-size:17px;color:#223e59}.summary i{width:4px;height:4px;border-radius:50%;background:#acb9c4}.pools{display:grid;grid-template-columns:1fr 1fr;gap:28px}.pool-section{--accent:#2278ee;--pale:#e8f4ff;--water:#78caff;min-width:0}.pool-section.girl{--accent:#db608a;--pale:#fff0f4;--water:#fba9c4}.pool-head{display:flex;justify-content:space-between;align-items:center;padding:0 12px 15px}.pool-name{font-weight:650;font-size:20px;color:var(--accent)}.pool-name small{display:block;font-size:10px;font-weight:600;letter-spacing:2px;margin-top:7px;opacity:.6}.count{font-size:36px;font-weight:650;letter-spacing:-1px;color:var(--accent);font-variant-numeric:tabular-nums}.count small{font-size:12px;letter-spacing:0;color:#8590a1;margin-left:5px}.pool{position:relative;height:345px;isolation:isolate;overflow:hidden;border-radius:45% 45% 40% 40% / 18% 18% 22% 22%;border:9px solid white;background:linear-gradient(170deg,var(--pale),var(--water));box-shadow:0 0 0 1px #e3eaf2,0 20px 35px -25px var(--accent),inset 0 12px 20px #ffffffb0}.pool:before,.pool:after{content:"";position:absolute;inset:12% -35%;border:2px solid #ffffff70;border-radius:45%;z-index:-1;transform:rotate(-15deg);animation:water 12s ease-in-out infinite alternate}.pool:after{inset:28% -20% -30%;transform:rotate(20deg);animation-delay:-5s;border-width:15px;border-color:#ffffff20}.water-label{position:absolute;bottom:21px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:4px;color:var(--accent);opacity:.38}.avatar{position:absolute;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:white;box-shadow:0 7px 12px #2868aa25;padding:0;animation:float 4s ease-in-out infinite alternate;transition:filter .2s}.avatar:hover{filter:brightness(1.08);z-index:5}.face{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg,#f5dbb6);font-size:30px;overflow:hidden}.face img{width:100%;height:100%;object-fit:cover}.avatar.mine{width:66px;height:66px;box-shadow:0 0 0 5px #ffffff65,0 8px 20px #246cb546;z-index:4}.mine:after{content:'我';position:absolute;bottom:-9px;left:17px;background:#203a52;color:white;font-size:10px;border-radius:9px;padding:2px 8px}.arrival{animation:drop .85s cubic-bezier(.22,.75,.3,1) both}.pool-actions{margin:22px 0 0}.join{background:white;border:1px solid #dce9f5;color:var(--accent);width:100%;padding:14px;border-radius:15px;font-weight:600;font-size:15px;transition:.2s}.join:hover{background:var(--pale);transform:translateY(-2px)}.join.active{background:var(--accent);color:white;border-color:var(--accent)}.hint{text-align:center;color:#8b99a8;font-size:12px;margin:23px 0}.profilebar{background:white;border:1px solid #e7edf3;border-radius:19px;max-width:520px;margin:26px auto 0;display:flex;align-items:center;padding:12px 16px;gap:12px}.profilebar .face{width:40px;height:40px;flex-shrink:0;font-size:25px}.profilebar strong{font-size:14px}.profilebar p{font-size:12px;color:#8a97a6;margin:5px 0 0}.edit{margin-left:auto;color:#68809a;background:transparent;font-size:13px;white-space:nowrap}footer{display:flex;justify-content:space-between;font-size:11px;color:#9aa6b3;margin-top:36px;border-top:1px solid #e5ebf1;padding-top:20px;letter-spacing:1px}dialog{border:1px solid #edf1f5;border-radius:26px;padding:28px;width:min(420px,calc(100% - 30px));box-shadow:0 30px 100px #18394c25;color:#243c53}dialog::backdrop{background:#18334b25;backdrop-filter:blur(5px)}dialog h2{font-size:23px;margin:6px 0 9px}dialog p{font-size:13px;color:#8996a4;line-height:1.7}.close{float:right;background:#f3f6f9;border-radius:50%;width:30px;height:30px;color:#708095}.step{font-size:11px;letter-spacing:2px;color:#287ef4}.profile-top{text-align:center;margin:20px 0}.profile-top .face{width:78px;height:78px;margin:auto;font-size:42px;border:4px solid white;box-shadow:0 0 0 1px #e4ebf2}.sync{color:#268263;background:#ecf8f2;padding:10px 16px;border-radius:10px;font-size:13px;margin-top:15px}.choices{display:flex;justify-content:center;gap:10px;margin:17px 0}.choice{border-radius:50%;width:40px;height:40px;background:#f2f6fa;font-size:24px;border:2px solid transparent}.choice.selected{border-color:#408cf7}label{display:block;font-size:13px;margin-top:20px}input{width:100%;padding:13px;border:1px solid #dee6ef;border-radius:11px;margin:9px 0 16px;color:#20374e;background:#fafcfe}.primary{width:100%;background:#243d55;color:white;padding:14px;border-radius:12px;font-size:14px}.notice{font-size:11px!important;text-align:center;margin-bottom:0}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#233d54;color:white;padding:12px 22px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;font-size:13px;z-index:20;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}#person{text-align:center}#person .face{width:85px;height:85px;font-size:46px;margin:25px auto 18px}.ripple{position:absolute;width:80px;height:80px;border:3px solid #fff;border-radius:50%;left:calc(48% - 7px);top:calc(57% - 7px);animation:ripple 1s .5s both;pointer-events:none}@keyframes float{to{transform:translate(5px,-12px) rotate(4deg)}}@keyframes water{to{transform:rotate(8deg) translateY(10px)}}@keyframes drop{0%{transform:translateY(-260px) scale(.7);opacity:0}65%{transform:translateY(15px) scale(1.08,.9);opacity:1}100%{transform:translateY(0) scale(1)}}@keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(2.5);opacity:0}}@media(max-width:600px){header{height:75px;padding:0 22px}.brand{font-size:22px}.pill{font-size:10px;padding:7px 10px}main{padding:12px 17px 24px}h1{font-size:29px}.intro p{font-size:12px}.summary{margin:23px 0}.pools{gap:14px}.pool-head{padding:0 5px 12px}.pool-name{font-size:17px}.pool-name small{font-size:9px;letter-spacing:1.5px}.count{font-size:27px}.count small{font-size:10px;margin-left:3px}.pool{height:295px;border-width:5px;border-radius:45% 45% 40% 40% / 12% 12% 14% 14%}.avatar{width:42px;height:42px;border-width:2px}.face{font-size:24px}.avatar.mine{width:47px;height:47px}.mine:after{left:10px}.join{font-size:13px;padding:13px 4px}.water-label{font-size:8px;letter-spacing:2px;bottom:19px}.profilebar{margin-top:22px}footer{font-size:9px;margin-top:27px}.ripple{width:55px;height:55px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
main{padding-top:64px}.intro{margin-bottom:48px}h1{font-size:38px;letter-spacing:3px}.pool-head{padding-bottom:20px}.profilebar{margin-top:32px}#myStatus{display:none}@media(max-width:600px){main{padding-top:43px}.intro{margin-bottom:35px}h1{font-size:25px;letter-spacing:1.5px}}
</style></head><body><main><section class="intro"><h1>JUE BABY LOTTERY</h1></section><span id="total" hidden></span><div class="pools"><section class="pool-section"><div class="pool-head"><div class="pool-name">boy</div><div class="count"><span id="boyCount">12</span><small>人</small></div></div><div class="pool" id="boyPool" aria-label="boy的头像"></div><div class="pool-actions"><button class="join" id="boyJoin">＋ 加入boy</button></div></section><section class="pool-section girl"><div class="pool-head"><div class="pool-name">girl</div><div class="count"><span id="girlCount">12</span><small>人</small></div></div><div class="pool" id="girlPool" aria-label="girl的头像"></div><div class="pool-actions"><button class="join" id="girlJoin">＋ 加入girl</button></div></section></div><div class="profilebar"><span class="face" id="myFace">🐱</span><div><strong id="myName">池边的新朋友</strong><p id="myStatus">准备好，来一场轻盈的相遇</p></div><button class="edit" id="edit">修改资料</button></div></main><dialog id="profile"><button class="close" aria-label="关闭" id="closeProfile">×</button><h2>先认识一下你</h2><p>确认头像和昵称。</p><div class="profile-top"><span class="face" id="draftFace">🐱</span><button class="sync" id="sync">模拟同步微信头像和昵称</button></div><div class="choices" id="choices" aria-label="选择头像"></div><form id="profileForm"><label for="nickname">你的昵称</label><input id="nickname" maxlength="20" required placeholder="大家怎么称呼你？" autocomplete="nickname"><button class="primary" type="submit">确认资料</button></form><p class="notice">Demo 使用模拟资料，不会读取你的微信信息。</p></dialog><dialog id="person"><button class="close" id="closePerson" aria-label="关闭">×</button><span class="face" id="personFace"></span><h2 id="personName"></h2><p id="personPool"></p><button class="primary" id="okay">关闭</button></dialog><div class="toast" id="toast" role="status"></div><script>
const $=id=>document.getElementById(id),key='pool-club-v1',faces=['🐱','🐼','🐰','🦊','🐶','🐨'];let state={name:'微信小伙伴',face:'🐱',confirmed:false,pool:null},pending=null,draft='🐱',toastTimer;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved.name==='string'&&saved.name.trim()&&faces.includes(saved.face)){state={name:saved.name.slice(0,20),face:saved.face,confirmed:saved.confirmed===true,pool:['boy','girl'].includes(saved.pool)?saved.pool:null};if(!state.confirmed)state.pool=null}}catch{}
function notify(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{notify('当前浏览器无法保存，关闭后资料可能丢失')}}
const names=['阿蓝','小岛','松果','一颗柠檬','阿树','北北','半杯汽水','小宇','晚风','南山','云朵','可乐','桃子','小满','橘子海','莓莓','夏天','圆圆','小雨','甜豆','月亮','花花','梨涡','泡芙'];const positions=[[12,14],[53,9],[32,29],[70,31],[9,47],[49,48],[25,68],[68,69],[7,76],[70,49],[33,9],[43,77]];const colors=['#fff0cf','#e6e1ff','#dff5ed','#ffdeda','#e6efff','#fce5ef'];
function avatar(name,face,index,mine,pool){const b=document.createElement('button');b.className='avatar'+(mine?' mine':'');b.setAttribute('aria-label',name+(mine?'，我':''));const pos=mine?[48,57]:positions[index];b.style.left=pos[0]+'%';b.style.top=pos[1]+'%';b.style.animationDelay=-(index%5)+'s';const f=document.createElement('span');f.className='face';f.textContent=face;f.style.setProperty('--bg',colors[index%6]);b.append(f);b.onclick=()=>{ $('personFace').textContent=face;$('personName').textContent=name+(mine?' · 我':'');$('personPool').textContent=(pool==='boy'?'蓝色boy':'粉色girl')+' · '+(mine?'已加入池子':'示例小伙伴');$('person').showModal()};return b}
function render(animate=false){for(const p of ['boy','girl']){const box=$(p+'Pool');box.querySelectorAll('.avatar,.ripple').forEach(x=>x.remove());for(let i=0;i<12;i++)box.append(avatar(names[i+(p==='girl'?12:0)],faces[(i+(p==='girl'?2:0))%6],i,false,p));if(state.pool===p){const a=avatar(state.name,state.face,0,true,p);box.append(a);if(animate){a.style.animationDelay='0s';a.classList.add('arrival');a.addEventListener('animationend',()=>a.classList.remove('arrival'),{once:true});const ripple=document.createElement('span');ripple.className='ripple';box.append(ripple);setTimeout(()=>ripple.remove(),1600)}}$(p+'Count').textContent=12+(state.pool===p?1:0);$(p+'Join').classList.toggle('active',state.pool===p);$(p+'Join').textContent=state.pool===p?'✓ 我在这里':state.pool?'切换到 '+(p==='boy'?'boy':'girl'):'加入 '+(p==='boy'?'boy':'girl')}$('total').textContent=24+(state.pool?1:0);$('myFace').textContent=state.face;$('myName').textContent=state.confirmed?state.name:'池边的新朋友';$('myStatus').textContent=state.pool?'你在'+(state.pool==='boy'?'boy':'girl')+' · 换个池子也可以':state.confirmed?'资料已就绪，选一个喜欢的池子吧':'准备好，来一场轻盈的相遇'}
function join(pool){if(!['boy','girl'].includes(pool))throw Error('无效的池子');if(!state.confirmed){pending=pool;openProfile();return}if(state.pool===pool){notify('你已经在这个池子里啦');return}const switched=!!state.pool;state.pool=pool;save();render(true);notify(switched?'换池成功，人数已同步更新':'扑通！欢迎加入'+(pool==='boy'?'boy':'girl'))}
function chooseFace(face){draft=face;$('draftFace').textContent=face;[...$('choices').children].forEach(b=>{b.classList.toggle('selected',b.textContent===face);b.setAttribute('aria-pressed',String(b.textContent===face))})}
function openProfile(){$('nickname').value=state.name;chooseFace(state.face);$('profile').showModal()}
faces.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=f;b.setAttribute('aria-label','使用'+f+'头像');b.onclick=()=>chooseFace(f);$('choices').append(b)});
$('sync').onclick=()=>{chooseFace('🐱');$('nickname').value='微信小伙伴';notify('已填入模拟微信资料，你可以继续修改')};$('profileForm').onsubmit=e=>{e.preventDefault();const name=$('nickname').value.trim();if(!name){$('nickname').setCustomValidity('请输入昵称');$('nickname').reportValidity();return}state.name=name;state.face=draft;state.confirmed=true;save();$('profile').close();render();if(pending){const p=pending;pending=null;join(p)}else notify('资料已保存，选一个池子吧')};$('nickname').oninput=()=>$('nickname').setCustomValidity('');$('closeProfile').onclick=()=>{$('profile').close();pending=null};$('profile').addEventListener('cancel',()=>pending=null);$('edit').onclick=()=>{pending=null;openProfile()};$('boyJoin').onclick=()=>join('boy');$('girlJoin').onclick=()=>join('girl');$('closePerson').onclick=$('okay').onclick=()=>$('person').close();render();if(!state.confirmed)openProfile();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'get_pool_state',description:'读取本机资料、池子选择和示例人数',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({...state,boyCount:12+(state.pool==='boy'?1:0),girlCount:12+(state.pool==='girl'?1:0)})})).catch(()=>{})}catch{}}
</script></body></html>
